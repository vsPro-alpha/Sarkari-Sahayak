services:
  - type: web
    name: sarkari-sahayak
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SARVAM_BASE_URL
        value: https://api.sarvam.ai
      - key: SARVAM_API_KEY
        sync: false
